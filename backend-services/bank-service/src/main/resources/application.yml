spring:
  application:
    name: bank-service
  datasource:
    url: jdbc:postgresql://localhost:5432/bank-a
    username: postgres
    password: admin
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8083

payments:
  bank:
    code: A

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId}] %logger - %msg%n"

